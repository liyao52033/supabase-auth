<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #e1e1e1;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #5a6edb;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 16px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }

        .success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .error {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Password Login Overlay Styles */
        #docLoginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .doc-icon {
            width: 56px;
            height: 56px;
            background: #ff7597;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .doc-icon svg {
            width: 32px;
            height: 32px;
            color: white;
        }

        .doc-title {
            font-size: 24px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 16px;
        }

        .doc-desc {
            font-size: 14px;
            color: #888;
            margin-bottom: 32px;
        }

        .doc-form {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 360px;
        }

        .doc-input-wrapper {
            position: relative;
            flex: 1;
        }

        .doc-form input {
            width: 100%;
            padding: 10px 40px 10px 16px;
            border: 1px solid #e1e1e1;
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
            color: #333;
            height: 44px;
            box-shadow: none;
        }
        
        .doc-form input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.1);
            outline: none;
        }

        .doc-form .toggle-eye {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .doc-form button {
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 24px;
            font-size: 14px;
            cursor: pointer;
            height: 44px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .doc-form button:hover {
            background: #7c3aed;
            transform: none;
        }

        .doc-form button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .doc-footer {
            position: absolute;
            bottom: 30px;
            font-size: 12px;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>

<body>
    <div id="docLoginOverlay">
        <div class="doc-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 6C4 4.89543 4.89543 4 6 4H10.5M4 6V18C4 19.1046 4.89543 20 6 20H18C19.1046 20 20 19.1046 20 18V10C20 8.89543 19.1046 8 18 8H13L10.5 4M4 6H10.5M10.5 4H12.5L15 8H18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M8 12H16M8 16H13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div class="doc-title">supabase接口</div>
        <div class="doc-desc">当前接口需要密码才可访问</div>
        <div class="doc-form">
            <div class="doc-input-wrapper">
                <input type="password" id="docPwdInput" placeholder="请输入密码" onkeydown="if(event.key === 'Enter') verifyDocPwd()">
                <div class="toggle-eye" onclick="toggleDocPwd()">
                    <svg id="eyeIconOpen" style="display: none;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg id="eyeIconClosed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </div>
            </div>
            <button id="docSubmitBtn" onclick="verifyDocPwd()">访问接口</button>
        </div>
        <div class="doc-footer">
            Built with <a href="https://cloud.tencent.com/document/product/1552/127369" target="_blank">edgeone pages</a>
        </div>
    </div>

    <div id="message"></div>

    <script >

         window.addEventListener('DOMContentLoaded', () => {
            // 检查是否已登录
            checkLoginStatus();
        });

        // 检查登录状态
        async function checkLoginStatus() {
            try {
                const res = await fetch('/checkLoginStatus', {
                    method: 'GET',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                });

                if(res.ok){
                   window.location.href= '/home.html'
                }
                
               
            } catch (err) {
                showMessage('网络错误', false);
            } 
        }
         
    
        function toggleDocPwd() {
            const input = document.getElementById('docPwdInput');
            const iconOpen = document.getElementById('eyeIconOpen');
            const iconClosed = document.getElementById('eyeIconClosed');
            if (input.type === 'password') {
                input.type = 'text';
                iconOpen.style.display = 'block';
                iconClosed.style.display = 'none';
            } else {
                input.type = 'password';
                iconOpen.style.display = 'none';
                iconClosed.style.display = 'block';
            }
        }

        async function verifyDocPwd() {
            const pwd = document.getElementById('docPwdInput').value;
            if (!pwd) {
                showMessage('请输入密码', false);
                return;
            }
            
            const btn = document.getElementById('docSubmitBtn');
            const originalText = btn.textContent;
            btn.textContent = '验证中...';
            btn.disabled = true;
            
            try {
                const res = await fetch('/verifyPwd', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pwd })
                });
                
                if (res.ok) {
                    const data = await res.json();
                    window.location.href= '/home.html'
                } else {    
                    const data = await res.json();
                    showMessage(data.error || '密码错误', false);
                }
            } catch (err) {
                showMessage('网络错误', false);
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

       

        // 显示提示消息
        function showMessage(text, isSuccess = true) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = isSuccess ? 'success' : 'error';
            messageEl.style.opacity = '1';

            setTimeout(() => {
                messageEl.style.opacity = '0';
                setTimeout(() => {
                    messageEl.className = '';
                    messageEl.style.opacity = '';
                }, 300);
            }, 3000);
        }

       
    </script>
</body>

</html>
